<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video dimostrativo</title>
<style>
  :root{--fg:#1f2328;--muted:#57606a;--line:#d0d7de;--soft:#f6f8fa;--accent:#714b67;--accent-soft:#f4eef3}
  *{box-sizing:border-box}
  body{margin:0;background:#fff;color:var(--fg);font:15px/1.55 'Segoe UI',Roboto,Arial,sans-serif}
  main{max-width:1180px;margin:0 auto;padding:20px 16px 48px}
  h1{font-size:26px;margin:6px 0 2px}
  p.lead{color:var(--muted);margin:0 0 14px}
  .layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
  video{width:100%;border-radius:8px;background:#000;border:1px solid var(--line)}
  aside{border:1px solid var(--line);border-radius:8px;overflow:hidden}
  aside h2{font-size:15px;margin:0;padding:10px 14px;background:var(--soft);border-bottom:1px solid var(--line)}
  ol{list-style:none;margin:0;padding:0}
  li button{all:unset;box-sizing:border-box;display:flex;gap:10px;width:100%;padding:9px 14px;cursor:pointer;border-bottom:1px solid var(--line)}
  li button:hover,li button:focus-visible{background:var(--accent-soft)}
  li.on button{background:var(--accent-soft);font-weight:600}
  .t{color:var(--accent);font-variant-numeric:tabular-nums;min-width:40px}
  a{color:var(--accent)}
  .links{margin-top:14px;font-size:14px}
  @media (max-width:820px){.layout{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<p><a href="/odoo/action-base.open_module_tree">← Torna alle App</a></p>
<h1>Flusso Operativo Software House</h1>
<p class="lead">Dimostrazione con gli utenti demo: vendita, commessa, pianificazione 80/20, foglio ore, alert, costi e margini. Didascalie in italiano, senza audio.</p>
<div class="layout">
  <video id="v" controls preload="metadata" poster="video_copertina.png">
    <source src="demo_flusso_operativo.mp4" type="video/mp4">
    Il browser non riesce a riprodurre il video: <a href="demo_flusso_operativo.mp4">scarica il file MP4</a>.
  </video>
  <aside><h2>Capitoli</h2><ol id="cap"></ol></aside>
</div>
<p class="links"><a href="demo_flusso_operativo.mp4" download>Scarica il video (MP4)</a> · <a href="analisi_tecnica.html">Analisi funzionale e tecnica</a></p>
</main>
<script>
  const v = document.getElementById('v');
  const ol = document.getElementById('cap');
  const fmt = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  const seek = s => { v.currentTime = s; v.play().catch(() => {}); };
  let caps = [];
  fetch('video_capitoli.json', {cache: 'no-cache'}).then(r => r.json()).then(list => {
    caps = list;
    for (const c of list) {
      const li = document.createElement('li');
      const b = document.createElement('button');
      b.innerHTML = '<span class="t">' + fmt(c.secondi) + '</span><span></span>';
      b.lastChild.textContent = (c.n ? c.n + '. ' : '') + c.titolo;
      b.addEventListener('click', () => seek(c.secondi));
      li.appendChild(b); ol.appendChild(li);
    }
    const m = location.hash.match(/t=(\d+)/);
    if (m) v.addEventListener('loadedmetadata', () => { v.currentTime = +m[1]; }, {once: true});
  }).catch(() => { ol.innerHTML = '<li style="padding:10px 14px;color:#57606a">Capitoli non disponibili</li>'; });
  v.addEventListener('timeupdate', () => {
    let k = -1;
    caps.forEach((c, i) => { if (v.currentTime + 0.3 >= c.secondi) k = i; });
    [...ol.children].forEach((li, i) => li.classList.toggle('on', i === k));
  });
</script>
</body>
</html>
