<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" width="760" height="640" font-size="13" font-family="Segoe UI, Arial, sans-serif" style="background:#fff"><defs><marker id="p3-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6e7781"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#1f2328">Il costo del consulente si conta una volta; si ribalta solo sui T&amp;M</text><g><rect x="24" y="48" width="712" height="568" rx="8" fill="none" stroke="#6e7781" stroke-width="1.25"></rect><line x1="24" y1="84" x2="736" y2="84" stroke="#6e7781" stroke-width="1"></line><line x1="224" y1="48" x2="224" y2="616" stroke="#d0d7de"></line><line x1="524" y1="48" x2="524" y2="616" stroke="#d0d7de"></line></g><text x="124" y="71" text-anchor="middle" font-weight="600" fill="#1f2328">Consulente esterno</text><text x="374" y="71" text-anchor="middle" font-weight="600" fill="#1f2328">Sistema (Odoo)</text><text x="630" y="71" text-anchor="middle" font-weight="600" fill="#1f2328">Amministrazione</text><g fill="none" stroke="#6e7781" stroke-width="1.25"><path d="M124 120V152" marker-end="url(#p3-arrow)"></path><path d="M194 176H274" marker-end="url(#p3-arrow)"></path><path d="M474 176H630V232" marker-end="url(#p3-arrow)"></path><path d="M630 280V312" marker-end="url(#p3-arrow)"></path><path d="M568 336H474" marker-end="url(#p3-arrow)"></path><path d="M374 360V380" marker-end="url(#p3-arrow)"></path><path d="M434 416H468" marker-end="url(#p3-arrow)"></path><path d="M374 452V472" marker-end="url(#p3-arrow)"></path><path d="M374 520V556" marker-end="url(#p3-arrow)"></path></g><circle cx="124" cy="108" r="12" fill="none" stroke="#6e7781" stroke-width="1.25"></circle><text x="144" y="112" font-size="11.5" fill="#57606a">lavoro svolto</text><g><rect x="54" y="152" width="140" height="48" rx="8" fill="none" stroke="#6e7781" stroke-width="1.25"></rect><text x="124" text-anchor="middle" fill="#1f2328"><tspan x="124" y="173">Segna le ore</tspan><tspan x="124" y="189">sulla commessa</tspan></text></g><g><rect x="274" y="152" width="200" height="48" rx="8" fill="none" stroke="#6e7781" stroke-width="1.25"></rect><text x="374" text-anchor="middle" fill="#1f2328"><tspan x="374" y="173">Costo maturato</tspan><tspan x="374" y="189">ore × tariffa, costo std 0</tspan></text></g><path d="M274 200L190 244" fill="none" stroke="#6e7781" stroke-width="1" stroke-dasharray="3 3"></path><path d="M48 244H40V292H48" fill="none" stroke="#6e7781" stroke-width="1"></path><text font-size="11.5" fill="#57606a"><tspan x="48" y="264">Su T&amp;M queste ore non</tspan><tspan x="48" y="280">si fatturano a ore</tspan></text><g><rect x="550" y="232" width="160" height="48" rx="8" fill="none" stroke="#6e7781" stroke-width="1.25"></rect><text x="630" text-anchor="middle" fill="#1f2328"><tspan x="630" y="253">Registra la fattura</tspan><tspan x="630" y="269">del consulente</tspan></text></g><text x="622" y="212" text-anchor="end" font-size="11.5" fill="#57606a">arriva la fattura</text><g><rect x="568" y="312" width="124" height="48" rx="8" fill="none" stroke="#6e7781" stroke-width="1.25"></rect><text x="630" text-anchor="middle" fill="#1f2328"><tspan x="630" y="333">Conferma</tspan><tspan x="630" y="349">la fattura</tspan></text></g><g><rect x="274" y="312" width="200" height="48" rx="8" fill="none" stroke="#6e7781" stroke-width="1.25"></rect><text x="374" text-anchor="middle" fill="#1f2328"><tspan x="374" y="333">Collega le ore,</tspan><tspan x="374" y="349">calcola lo scostamento</tspan></text></g><g><polygon points="314,416 374,380 434,416 374,452" fill="none" stroke="#6e7781" stroke-width="1.25"></polygon><text x="374" text-anchor="middle" fill="#1f2328"><tspan x="374" y="412">Commessa</tspan><tspan x="374" y="427">T&amp;M?</tspan></text></g><text x="382" y="466" font-size="11.5" fill="#57606a">sì</text><text x="442" y="408" font-size="11.5" fill="#57606a">no</text><circle cx="480" cy="416" r="12" fill="none" stroke="#6e7781" stroke-width="3"></circle><text x="480" text-anchor="middle" font-size="11.5" fill="#57606a"><tspan x="480" y="446">solo</tspan><tspan x="480" y="460">costo</tspan></text><g><rect x="274" y="472" width="200" height="48" rx="8" fill="none" stroke="#6e7781" stroke-width="1.25"></rect><text x="374" text-anchor="middle" fill="#1f2328"><tspan x="374" y="493">Riga di spesa sull&#x27;ordine:</tspan><tspan x="374" y="509">costo + ricarico</tspan></text></g><circle cx="374" cy="568" r="12" fill="none" stroke="#6e7781" stroke-width="3"></circle><text x="394" y="572" font-size="11.5" fill="#57606a">spesa da fatturare al cliente</text></svg>