<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="900" height="900" font-size="13" font-family="Segoe UI, Arial, sans-serif" style="background:#fff"><defs><marker id="p5-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6e7781"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#1f2328">Ogni giorno le ore, ogni settimana il riepilogo, a fine mese la chiusura</text><g><rect x="24" y="48" width="852" height="840" rx="8" fill="none" stroke="#6e7781" stroke-width="1.25"></rect><line x1="24" y1="84" x2="876" y2="84" stroke="#6e7781" stroke-width="1"></line><line x1="310" y1="48" x2="310" y2="888" stroke="#d0d7de"></line><line x1="590" y1="48" x2="590" y2="888" stroke="#d0d7de"></line></g><text x="170" y="71" text-anchor="middle" font-weight="600" fill="#1f2328">Persona (team e consulenti)</text><text x="450" y="71" text-anchor="middle" font-weight="600" fill="#1f2328">Sistema (Odoo)</text><text x="730" y="71" text-anchor="middle" font-weight="600" fill="#1f2328">PM / Amministrazione</text><g fill="none" stroke="#6e7781" stroke-width="1.25"><path d="M170 124V150" marker-end="url(#p5-arrow)"></path><path d="M290 172H330" marker-end="url(#p5-arrow)"></path><path d="M730 124V150" marker-end="url(#p5-arrow)"></path><path d="M610 170H570" marker-end="url(#p5-arrow)"></path><path d="M290 276H310V190H330" marker-end="url(#p5-arrow)"></path><path d="M450 202V240" marker-end="url(#p5-arrow)"></path><path d="M450 284V320" marker-end="url(#p5-arrow)"></path><path d="M330 346H36V176H50" marker-end="url(#p5-arrow)"></path><path d="M472 262H610V540H570" marker-end="url(#p5-arrow)"></path><path d="M450 432V450" marker-end="url(#p5-arrow)"></path><path d="M450 592V618" marker-end="url(#p5-arrow)"></path><path d="M472 640H730V592" marker-end="url(#p5-arrow)"></path><path d="M730 714V730" marker-end="url(#p5-arrow)"></path><path d="M730 770V790" marker-end="url(#p5-arrow)"></path><path d="M708 812H570" marker-end="url(#p5-arrow)"></path><path d="M752 812H840V320H570" marker-end="url(#p5-arrow)"></path><path d="M450 842V860" marker-end="url(#p5-arrow)"></path></g><circle cx="170" cy="112" r="12" fill="none" stroke="#6e7781" stroke-width="1.25"></circle><text x="190" y="116" font-size="11.5" fill="#57606a">ogni giorno lavorativo</text><g><rect x="50.0" y="150" width="240" height="52" rx="8" fill="none" stroke="#6e7781" stroke-width="1.25"></rect><text x="170" text-anchor="middle" fill="#1f2328"><tspan x="170" y="172">Registra le ore sul task</tspan><tspan x="170" y="188">e le ore residue</tspan></text></g><g><rect x="50.0" y="250" width="240" height="52" rx="8" fill="none" stroke="#6e7781" stroke-width="1.25"></rect><text x="170" text-anchor="middle" fill="#1f2328"><tspan x="170" y="272">Assente? Chiede l'assenza</tspan><tspan x="170" y="288">in Ferie e permessi</tspan></text></g><circle cx="730" cy="112" r="12" fill="none" stroke="#6e7781" stroke-width="1.25"></circle><text x="750" y="116" font-size="11.5" fill="#57606a">assenza da approvare</text><g><rect x="610.0" y="150" width="240" height="40" rx="8" fill="none" stroke="#6e7781" stroke-width="1.25"></rect><text x="730" text-anchor="middle" fill="#1f2328"><tspan x="730" y="174">Approva l'assenza</tspan></text></g><g><rect x="330.0" y="150" width="240" height="52" rx="8" fill="none" stroke="#6e7781" stroke-width="1.25"></rect><text x="450" text-anchor="middle" fill="#1f2328"><tspan x="450" y="172">Ore attese = orario di lavoro</tspan><tspan x="450" y="188">meno assenze e festività</tspan></text></g><path d="M450 240L472 262L450 284L428 262Z" fill="none" stroke="#6e7781" stroke-width="1.25"></path><path d="M443 255L457 269M457 255L443 269" stroke="#6e7781" stroke-width="1.5"></path><text x="420" y="266" text-anchor="end" font-size="11.5" fill="#57606a">mancano ore?</text><g><rect x="330.0" y="320" width="240" height="52" rx="8" fill="none" stroke="#6e7781" stroke-width="1.25"></rect><text x="450" text-anchor="middle" fill="#1f2328"><tspan x="450" y="342">Il mattino dopo: promemoria</tspan><tspan x="450" y="358">solo alla persona</tspan></text></g><circle cx="450" cy="420" r="12" fill="none" stroke="#6e7781" stroke-width="1.25"></circle><circle cx="450" cy="420" r="8" fill="none" stroke="#6e7781" stroke-width="1"></circle><path d="M450 420V414M450 420H454" fill="none" stroke="#6e7781" stroke-width="1"></path><text x="470" y="424" font-size="11.5" fill="#57606a">lunedì</text><g><rect x="330.0" y="450" width="240" height="52" rx="8" fill="none" stroke="#6e7781" stroke-width="1.25"></rect><text x="450" text-anchor="middle" fill="#1f2328"><tspan x="450" y="472">Riepilogo della settimana</tspan><tspan x="450" y="488">prima alla persona</tspan></text></g><g><rect x="330.0" y="540" width="240" height="52" rx="8" fill="none" stroke="#6e7781" stroke-width="1.25"></rect><text x="450" text-anchor="middle" fill="#1f2328"><tspan x="450" y="562">Task: stima a finire, ritardi</tspan><tspan x="450" y="578">rispetto alle date pianificate</tspan></text></g><path d="M450 618L472 640L450 662L428 640Z" fill="none" stroke="#6e7781" stroke-width="1.25"></path><path d="M443 633L457 647M457 633L443 647" stroke="#6e7781" stroke-width="1.5"></path><text x="420" y="644" text-anchor="end" font-size="11.5" fill="#57606a">sforerà la stima?</text><g><rect x="610.0" y="540" width="240" height="52" rx="8" fill="none" stroke="#6e7781" stroke-width="1.25"></rect><text x="730" text-anchor="middle" fill="#1f2328"><tspan x="730" y="562">Rivede stima, date</tspan><tspan x="730" y="578">o accordi con il cliente</tspan></text></g><circle cx="730" cy="702" r="12" fill="none" stroke="#6e7781" stroke-width="1.25"></circle><text x="750" y="706" font-size="11.5" fill="#57606a">mese finito</text><g><rect x="650.0" y="730" width="160" height="40" rx="8" fill="none" stroke="#6e7781" stroke-width="1.25"></rect><text x="730" text-anchor="middle" fill="#1f2328"><tspan x="730" y="754">Chiudi mese</tspan></text></g><path d="M730 790L752 812L730 834L708 812Z" fill="none" stroke="#6e7781" stroke-width="1.25"></path><path d="M723 805L737 819M737 805L723 819" stroke="#6e7781" stroke-width="1.5"></path><text x="700" y="816" text-anchor="end" font-size="11.5" fill="#57606a"></text><text x="760" y="798" font-size="11.5" fill="#57606a">ore complete?</text><g><rect x="330.0" y="790" width="240" height="52" rx="8" fill="none" stroke="#6e7781" stroke-width="1.25"></rect><text x="450" text-anchor="middle" fill="#1f2328"><tspan x="450" y="812">Mese chiuso: ore bloccate</tspan><tspan x="450" y="828">(riapre l'Amministrazione)</tspan></text></g><circle cx="450" cy="872" r="12" fill="none" stroke="#6e7781" stroke-width="3"></circle><text x="470" y="876" font-size="11.5" fill="#57606a">fine</text><text x="456" y="304" font-size="11.5" fill="#57606a">sì</text><text x="44" y="340" font-size="11.5" fill="#57606a">a fine giornata</text><text x="480" y="278" font-size="11.5" fill="#57606a">no</text><text x="490" y="658" font-size="11.5" fill="#57606a">sì: attività al PM</text><text x="578" y="830" font-size="11.5" fill="#57606a">sì, o Chiudi comunque</text><text x="760" y="850" font-size="11.5" fill="#57606a">no: sollecita</text></svg>