[options]
; Le credenziali del database arrivano da .env tramite docker-compose (HOST/USER/PASSWORD).
; Nessuna password in questo file.
addons_path = /mnt/extra-addons,/mnt/third-party/oca-contract,/mnt/third-party/oca-project,/mnt/third-party/oca-web,/mnt/third-party/oca-l10n-italy,/mnt/third-party/oca-account-closing,/mnt/third-party/oca-account-financial-reporting,/mnt/third-party/oca-account-financial-tools,/mnt/third-party/oca-account-payment,/mnt/third-party/oca-currency,/mnt/third-party/oca-delivery-carrier,/mnt/third-party/oca-partner-contact,/mnt/third-party/oca-product-attribute,/mnt/third-party/oca-reporting-engine,/mnt/third-party/oca-server-ux,/mnt/third-party/oca-stock-logistics-workflow,/usr/lib/python3/dist-packages/odoo/addons
data_dir = /var/lib/odoo
db_name = lab18
dbfilter = ^lab18$
; Gestore database web disattivato: reset/creazione si fanno con gli script in scripts/
list_db = False
proxy_mode = False
log_level = info
without_demo = False
; dev mode (--dev=xml,reload) e' nel "command" di docker-compose.yml: Odoo 18 non lo legge da questo file
