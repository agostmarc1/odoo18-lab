[options]
; Istanza dedicata di una cantina. Le credenziali del database arrivano dal file .env del cliente
; (HOST/USER/PASSWORD nel docker-compose.yml). Nessuna password in questo file.
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
data_dir = /var/lib/odoo
; Gestore database web disattivato: un solo database per istanza, creato da nuovo_cliente.sh
list_db = False
proxy_mode = False
log_level = info
